# Ensure consistent locale to avoid MS-DOS ZIP date issues (e.g., Buddhist calendar)
org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Duser.country=US -Duser.language=en
# Force Gradle to use JDK 17 on developer machines (adjust path if needed)
# If you need to force a local JDK, uncomment and adjust the following line.
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
# Suppress AGP/compileSdk mismatch warning for compileSdk=34 used by the project
android.suppressUnsupportedCompileSdk=34
android.useAndroidX=true
android.enableJetifier=true
